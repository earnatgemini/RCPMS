<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RCPMS Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div>

                <h2>🍛 Rajeswari</h2>

                <p class="sidebar-title">
                    Curry Point
                </p>

            </div>

            <nav>

                <a href="#" id="dashboardMenu">🏠 Dashboard</a>

                <a href="#" id="branchesMenu">🏪 Branches</a>

                <a href="#">👨‍🍳 Employees</a>

                <a href="#">🍲 Today's Menu</a>

                <a href="#">📦 Stock</a>

                <a href="#">💰 Sales</a>

                <a href="#">📝 Credits</a>

                <a href="#">💵 Expenses</a>

                <a href="#">📅 Attendance</a>

                <a href="#">💼 Salary</a>

                <a href="#">📊 Reports</a>

            </nav>

            <button class="logout-btn" id="sideLogoutBtn">

                Logout

            </button>

        </aside>

        <!-- Main -->

        <main class="content">

            <!-- Top Bar -->

            <header class="topbar">

                <div>

                    <h1 id="pageTitle">

                        Dashboard

                    </h1>

                    <p id="userEmail"></p>

                </div>

                <button class="logout-btn" id="topLogoutBtn">

                    Logout

                </button>

            </header>

            <!-- Dashboard -->

            <section id="dashboardView">

                <div class="cards">

                    <div class="card">

                        <h3>Total Branches</h3>

                        <h2 id="branchCount">

                            0

                        </h2>

                    </div>

                    <div class="card">

                        <h3>Today's Sales</h3>

                        <h2>

                            ₹0

                        </h2>

                    </div>

                    <div class="card">

                        <h3>Today's Expenses</h3>

                        <h2>

                            ₹0

                        </h2>

                    </div>

                    <div class="card">

                        <h3>Today's Profit</h3>

                        <h2>

                            ₹0

                        </h2>

                    </div>

                </div>

            </section>

            <!-- Branch Management -->

            <section id="branchView" class="hidden">

                <h2>

                    Branch Management

                </h2>

                <form id="branchForm">

                    <input type="hidden" id="branchId">

                    <div class="form-group">

                        <label>

                            Branch Name

                        </label>

                        <input
                            type="text"
                            id="branchName"
                            required>

                    </div>

                    <div class="form-group">

                        <label>

                            Phone

                        </label>

                        <input
                            type="text"
                            id="branchPhone"
                            required>

                    </div>

                    <div class="form-group">

                        <label>

                            Address

                        </label>

                        <input
                            type="text"
                            id="branchAddress"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="save-btn">

                        Save Branch

                    </button>

                </form>

                <table class="table">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Phone</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="branchTable">

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <script
        type="module"
        src="js/dashboard.js">

    </script>

</body>

</html>
